# hub-stage: test
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run unit tests
        run: ./scripts/run-unit-tests.sh

      - name: Upload unit-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unit-test-results
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: Simulator UI tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Validate simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run UI tests
        env:
          IOS_SIMULATOR_NAME: iPhone 16
          IOS_SIMULATOR_OS: 18.5
        run: ./scripts/run-ui-tests.sh

      - name: Upload UI-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-ui-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ui-test-results
          if-no-files-found: ignore
          retention-days: 7
