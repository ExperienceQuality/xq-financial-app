# hub-stage: build
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signing-free iOS build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: ./scripts/resolve-packages.sh

      - name: Build without signing
        run: ./scripts/build.sh

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: finance-build-${{ github.sha }}
          path: build/DerivedData/Build/Products
          if-no-files-found: error
          retention-days: 7
